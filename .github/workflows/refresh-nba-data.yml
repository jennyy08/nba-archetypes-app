name: Refresh NBA stats

on:
  schedule:
    - cron: '37 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-nba-data
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install refresh dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Fetch and validate NBA stats
        run: python backend/app.py refresh
      - name: Publish an updated snapshot
        run: |
          if git diff --quiet -- public/data/players.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/data/players.json
          git commit -m "Refresh NBA player stats"
          git push origin HEAD
